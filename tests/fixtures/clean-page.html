<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarterly results - Acme</title>
</head>
<body>
  <a href="#main" class="skip">Skip to main content</a>
  <nav aria-label="Primary"><a href="/">Home</a> <a href="/results">Results</a></nav>
  <main id="main">
    <h1>Quarterly results</h1>
    <img src="chart.png" alt="Revenue rose from 4.1m in Q1 to 5.3m in Q2.">
    <img src="divider.png" alt="">
    <h2>Ask a question</h2>
    <form>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <fieldset>
        <legend>Contact preference</legend>
        <label for="c1">Email</label><input type="radio" id="c1" name="pref" value="e">
        <label for="c2">Phone</label><input type="radio" id="c2" name="pref" value="p">
      </fieldset>
      <button type="submit">Send question</button>
    </form>
    <h2>Revenue by quarter</h2>
    <table>
      <caption>Revenue by quarter, in millions</caption>
      <tr><th scope="col">Quarter</th><th scope="col">Revenue</th></tr>
      <tr><td>Q1</td><td>4.1</td></tr>
      <tr><td>Q2</td><td>5.3</td></tr>
    </table>
    <iframe src="/embed" title="Interactive revenue chart"></iframe>
  </main>
</body>
</html>
